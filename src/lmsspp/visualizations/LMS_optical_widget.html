<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LMS Optical Widget</title>
  <style>
    :root {
      --canvas-max: 680px;
      --bg: #f6f6f6;
      --border: rgba(20, 20, 20, 0.14);
      --ink: #0b0b0b;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", Times, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(14px, 2.4vw, 32px);
    }
    body[data-visual-mode="dark"] {
      --bg: #0b0c10;
      color: #ffffff;
    }

    .widgetShell {
      width: min(var(--canvas-max), 92vw);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
    }

    .tabChrome {
      position: relative;
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 18px 18px 0 0;
      background: rgba(255, 255, 255, 0.82);
      box-shadow:
        0 1px 0 rgba(0, 0, 0, 0.06),
        0 12px 36px rgba(0, 0, 0, 0.08);
      padding: 8px 10px 0;
      min-height: 42px;
      box-sizing: border-box;
      overflow: hidden;
      margin-bottom: -1px;
      z-index: 2;
    }
    .tabChrome.tightWidth {
      width: 100%;
    }
    body[data-visual-mode="dark"] .tabChrome {
      background: rgba(11, 12, 16, 0.94);
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.04),
        0 14px 40px rgba(0, 0, 0, 0.32);
    }

    .wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      --uiScale: 1;
      --titleX: 0px;
      --titleY: 0px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 18px 18px;
      overflow: hidden;
      box-shadow:
        0 1px 0 rgba(0, 0, 0, 0.06),
        0 18px 60px rgba(0, 0, 0, 0.10);
    }
    body[data-visual-mode="dark"] .wrap {
      background: rgba(11, 12, 16, 0.92);
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.04),
        0 18px 60px rgba(0, 0, 0, 0.34);
    }
    .mainPanel {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .resizeHandle {
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: auto;
      z-index: 6;
      background: transparent;
    }
    .resizeHandle.nw { left: 0; top: 0; cursor: nwse-resize; }
    .resizeHandle.ne { right: 0; top: 0; cursor: nesw-resize; }
    .resizeHandle.sw { left: 0; bottom: 0; cursor: nesw-resize; }
    .resizeHandle.se { right: 0; bottom: 0; cursor: nwse-resize; }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .lmsModeControl {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 7;
      pointer-events: auto;
      display: none;
      align-items: stretch;
      gap: 0;
      padding: 0;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.90);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }
    .lmsModeControl.show {
      display: inline-flex;
    }
    .lmsAtomControl {
      left: auto;
      right: 12px;
    }
    .lmsModeButtons {
      display: inline-flex;
      gap: 0;
    }
    .lmsModeBtn {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-left: 1px solid rgba(0, 0, 0, 0.14);
      background: transparent;
      color: rgba(0, 0, 0, 0.78);
      border-radius: 0;
      width: 42px;
      min-width: 42px;
      padding: 5px 0;
      font-size: 11px;
      line-height: 1.1;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
      box-shadow: none;
    }
    .lmsModeBtn:first-child {
      border-left: 0;
    }
    .lmsModeBtn.active {
      background: rgba(21, 21, 21, 0.94);
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }
    .lmsAtomControl .lmsModeBtn {
      width: 24px;
      min-width: 8px;
      aspect-ratio: 1 / 1;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }
    body[data-visual-mode="dark"] .lmsModeControl {
      background: rgba(11, 12, 16, 0.90);
      border-color: rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.30);
    }
    body[data-visual-mode="dark"] .lmsModeBtn {
      background: transparent;
      color: rgba(255, 255, 255, 0.86);
      border-left-color: rgba(255, 255, 255, 0.12);
      box-shadow: none;
    }
    body[data-visual-mode="dark"] .lmsModeBtn:first-child {
      border-left: 0;
    }
    body[data-visual-mode="dark"] .lmsModeBtn.active {
      background: rgba(241, 245, 249, 0.94);
      color: #0b0c10;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.34);
    }

    .tabBar {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      justify-content: flex-start;
      flex-wrap: nowrap;
      pointer-events: auto;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .tabBar::-webkit-scrollbar { display: none; }

    .tabBtn {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid rgba(0, 0, 0, 0.18);
      background: rgba(255, 255, 255, 0.86);
      border-radius: 11px;
      padding: 6px 10px;
      font-size: 12px;
      line-height: 1.1;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.82);
      user-select: none;
      position: relative;
      top: 0;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
    }
    .tabBtn.active {
      background: rgba(21, 21, 21, 0.94);
      color: #fff;
      border-color: rgba(21, 21, 21, 0.98);
      border-bottom-color: rgba(21, 21, 21, 0.98);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.24) inset,
        0 5px 14px rgba(0, 0, 0, 0.18);
      font-weight: 600;
      z-index: 1;
    }
    body[data-visual-mode="dark"] .tabBtn {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.86);
      border-color: rgba(255, 255, 255, 0.16);
    }
    body[data-visual-mode="dark"] .tabBtn.active {
      background: rgba(241, 245, 249, 0.96);
      color: #0b0c10;
      border-color: rgba(241, 245, 249, 0.98);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.42) inset,
        0 8px 20px rgba(0, 0, 0, 0.28);
    }
    .tabBtn:focus-visible {
      outline: 2px solid rgba(0, 0, 0, 0.7);
      outline-offset: 1px;
    }

    .titleDrag {
      position: absolute;
      left: 50%;
      top: 3.5%;
      transform: translate(-50%, 0) translate(var(--titleX), var(--titleY));
      pointer-events: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      z-index: 7;
      width: auto;
      max-width: min(100%, 820px);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
    }
    .titleDrag > * {
      pointer-events: auto;
    }
    .titleDrag:active,
    .titleDrag:active > * { cursor: grabbing; }

    .title {
      text-align: center;
      font-size: calc(26px * var(--uiScale));
      line-height: 1.1;
      margin: 0;
      padding: 0;
      display: inline-block;
      white-space: nowrap;
    }
    .title .italic { font-style: italic; }
    body[data-visual-mode="dark"] .titleDrag,
    body[data-visual-mode="dark"] .title,
    body[data-visual-mode="dark"] .tRange {
      color: #ffffff;
    }
    .formula {
      margin-top: calc(10px * var(--uiScale));
      display: grid;
      justify-items: center;
      gap: calc(8px * var(--uiScale));
    }
    .box {
      border: 2px solid #000;
      padding: calc(8px * var(--uiScale)) calc(14px * var(--uiScale));
      font-size: calc(24px * var(--uiScale));
      line-height: 1;
      background: rgba(255, 255, 255, 0.92);
      max-width: none;
      white-space: nowrap;
    }
    body[data-visual-mode="dark"] .box {
      border-color: rgba(255, 255, 255, 0.84);
      background: rgba(11, 12, 16, 0.92);
      color: #ffffff;
    }
    .titleHidden #titleText,
    .titleHidden .formula { display: none; }
    .tRange {
      font-size: calc(22px * var(--uiScale));
    }
    .settingsCard {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow:
        0 1px 0 rgba(0, 0, 0, 0.05),
        0 12px 36px rgba(0, 0, 0, 0.07);
      padding: 8px 10px;
      box-sizing: border-box;
    }
    body[data-visual-mode="dark"] .settingsCard {
      background: rgba(11, 12, 16, 0.90);
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.04),
        0 12px 36px rgba(0, 0, 0, 0.30);
    }
    .settingsToolbar {
      display: flex;
      min-height: 58px;
    }
    .settingsTitle {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.2px;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.72);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .displayLayout {
      display: flex;
      align-items: stretch;
      gap: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      width: 100%;
    }
    .displayLayout::-webkit-scrollbar { display: none; }
    .displayLead {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      flex: 0 0 auto;
      padding-right: 10px;
      border-right: 1px solid rgba(0, 0, 0, 0.12);
    }
    .leadToggleRow {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
      gap: 6px;
      width: min(240px, 100%);
    }
    .leadToggleRow .displayBtn {
      width: 100%;
      justify-content: center;
      text-align: center;
      padding-left: 0;
      padding-right: 0;
    }
    body[data-visual-mode="dark"] .settingsTitle {
      color: rgba(255, 255, 255, 0.76);
    }
    body[data-visual-mode="dark"] .displayLead {
      border-right-color: rgba(255, 255, 255, 0.14);
    }
    .modeButtons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 190px;
    }
    .modeBtn {
      padding: 4px 9px;
      font-size: 10px;
    }
    .settingsSections {
      display: flex;
      align-items: stretch;
      flex: 1 1 auto;
      min-width: 0;
    }
    .settingsSection {
      display: flex;
      flex: 1 1 0;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      padding: 2px 10px 4px;
      box-sizing: border-box;
      border-left: 1px solid rgba(0, 0, 0, 0.12);
      transition: background 120ms ease;
    }
    body[data-visual-mode="dark"] .settingsSection {
      border-left-color: rgba(255, 255, 255, 0.14);
    }
    .settingsSection:first-child {
      border-left: none;
    }
    .settingsSection.inactive {
      background: rgba(0, 0, 0, 0.06);
    }
    body[data-visual-mode="dark"] .settingsSection.inactive {
      background: rgba(255, 255, 255, 0.07);
    }
    .sectionGate {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      background: rgba(255, 255, 255, 0.18);
      color: rgba(0, 0, 0, 0.72);
      padding: 4px 8px 6px;
      border-radius: 8px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 0.24px;
      text-transform: uppercase;
      text-align: left;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }
    body[data-visual-mode="dark"] .sectionGate {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.76);
    }
    .settingsSection.inactive .sectionGate {
      background: rgba(0, 0, 0, 0.14);
      color: rgba(0, 0, 0, 0.92);
    }
    body[data-visual-mode="dark"] .settingsSection.inactive .sectionGate {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.94);
    }
    .sectionButtons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-height: 31px;
    }
    .sectionBreak {
      flex-basis: 100%;
      width: 0;
      height: 0;
    }
    .settingsSection.inactive .sectionButtons {
      opacity: 0.34;
    }
    .displayBtn {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid rgba(0, 0, 0, 0.18);
      background: rgba(255, 255, 255, 0.36);
      color: rgba(0, 0, 0, 0.76);
      border-radius: 999px;
      padding: 6px 10px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 11px;
      line-height: 1.1;
      white-space: nowrap;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }
    .displayBtn.active {
      background: rgba(21, 21, 21, 0.94);
      color: #fff;
      border-color: rgba(21, 21, 21, 0.98);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.18) inset,
        0 5px 14px rgba(0, 0, 0, 0.14);
    }
    body[data-visual-mode="dark"] .displayBtn {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.84);
      border-color: rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    body[data-visual-mode="dark"] .displayBtn.active {
      background: rgba(241, 245, 249, 0.94);
      color: #0b0c10;
      border-color: rgba(241, 245, 249, 0.96);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.34) inset,
        0 5px 14px rgba(0, 0, 0, 0.26);
    }
    .displayBtn.stored {
      background: rgba(21, 21, 21, 0.10);
      color: rgba(21, 21, 21, 0.90);
      border-color: rgba(21, 21, 21, 0.32);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }
    body[data-visual-mode="dark"] .displayBtn.stored {
      background: rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.90);
      border-color: rgba(255, 255, 255, 0.26);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .displayBtn.unsupported {
      opacity: 0.72;
    }
    .displayBtn:focus-visible {
      outline: 2px solid rgba(0, 0, 0, 0.70);
      outline-offset: 1px;
    }

    .cornerBtn {
      position: absolute;
      bottom: 12px;
      z-index: 5;
      pointer-events: auto;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid rgba(0, 0, 0, 0.18);
      background: rgba(255, 255, 255, 0.82);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      touch-action: manipulation;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      cursor: pointer;
    }
    body[data-visual-mode="dark"] .cornerBtn {
      background: rgba(11, 12, 16, 0.88);
      color: #e8e8e8;
      border-color: rgba(255, 255, 255, 0.16);
    }
    .cornerBtn:hover { background: rgba(255, 255, 255, 0.95); }
    body[data-visual-mode="dark"] .cornerBtn:hover { background: rgba(17, 18, 24, 0.96); }
    .cornerLeft { left: 12px; }
    .cornerRight { right: 12px; }

    .helpCard {
      position: absolute;
      right: 12px;
      bottom: 60px;
      z-index: 6;
      width: min(380px, calc(100% - 24px));
      box-sizing: border-box;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.90);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14);
      padding: 11px 12px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      color: rgba(0, 0, 0, 0.82);
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 140ms ease, transform 140ms ease;
    }
    body[data-visual-mode="dark"] .helpCard {
      background: rgba(11, 12, 16, 0.94);
      color: #e8e8e8;
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.34);
    }
    .helpCard.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div class="widgetShell">
    <div id="tabChrome" class="tabChrome tightWidth">
      <div id="tabBar" class="tabBar" role="tablist" aria-label="Geometry mode tabs"></div>
    </div>
    <div class="mainPanel">
      <div class="wrap" id="wrap">
        <canvas id="c"></canvas>
        <button id="btnReset" class="cornerBtn cornerLeft" type="button">Reset</button>
        <button id="btnHelp" class="cornerBtn cornerRight" type="button">Help</button>
        <div id="helpCard" class="helpCard">
          Drag points inside the disk, switch tabs above the widget, drag the title, reset the state, or resize from any corner.
        </div>
        <div class="resizeHandle nw" data-handle="nw" aria-hidden="true"></div>
        <div class="resizeHandle ne" data-handle="ne" aria-hidden="true"></div>
        <div class="resizeHandle sw" data-handle="sw" aria-hidden="true"></div>
        <div class="resizeHandle se" data-handle="se" aria-hidden="true"></div>

        <div class="overlay">
          <div id="lmsAtomControl" class="lmsModeControl lmsAtomControl" aria-label="LMS boundary atom count"></div>
          <div id="titleDrag" class="titleDrag" aria-label="Drag to reposition the title">
            <div id="titleText" class="title">Gyro-geodesic through two draggable points</div>
            <div class="formula">
              <div id="formulaText" class="box">A ⊕ (⊖A ⊕ B) ⊗ t</div>
              <div id="rangeText" class="tRange"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="settingsCard" class="settingsCard">
        <div id="settingsToolbar" class="settingsToolbar">
          <div id="displayControls" class="displayLayout" role="group" aria-label="Display controls">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ---------- core math ----------
    const EPS = 1e-10;
    const TAU = Math.PI * 2;

    function norm2(v){ return v.x*v.x + v.y*v.y; }
    function norm(v){ return Math.hypot(v.x, v.y); }
    function dot(a,b){ return a.x*b.x + a.y*b.y; }
    function cross(a,b){ return a.x*b.y - a.y*b.x; }
    function add(a,b){ return {x:a.x+b.x, y:a.y+b.y}; }
    function sub(a,b){ return {x:a.x-b.x, y:a.y-b.y}; }
    function scale(v,s){ return {x:v.x*s, y:v.y*s}; }
    function neg(v){ return {x:-v.x, y:-v.y}; }
    function perp(v){ return {x:-v.y, y:v.x}; }
    function unit(v){
      const r = norm(v);
      if (r < EPS) return {x:1, y:0};
      return scale(v, 1/r);
    }
    function rot(v, ang){
      const c = Math.cos(ang), s = Math.sin(ang);
      return { x: c*v.x - s*v.y, y: s*v.x + c*v.y };
    }
    function clampToDisk(v, maxR=0.999){
      const r = norm(v);
      if (r <= maxR) return v;
      return scale(v, maxR / r);
    }
    function angleOf(v){
      return Math.atan2(v.y, v.x);
    }
    function formatNum(x, digits=3){
      return Number.isFinite(x) ? x.toFixed(digits) : "0.000";
    }

    // Möbius action / gyroaddition on the unit disk
    function mobiusAdd(a,b){
      const a2 = norm2(a), b2 = norm2(b), ab = dot(a,b);
      const denom = 1 + 2*ab + a2*b2;
      return {
        x: ((1 + 2*ab + b2)*a.x + (1 - a2)*b.x) / denom,
        y: ((1 + 2*ab + b2)*a.y + (1 - a2)*b.y) / denom
      };
    }
    function mobiusScalar(t, v){
      const r = norm(v);
      if (r < EPS) return {x:0, y:0};
      const rr = Math.min(r, 0.999999999);
      const k = Math.tanh(t * Math.atanh(rr)) / r;
      return scale(v, k);
    }
    function gyroPoint(A,B,t){
      const delta = mobiusAdd(neg(A), B);
      return mobiusAdd(A, mobiusScalar(t, delta));
    }
    function mobiusBoundaryAction(w, x){
      // Continuous boundary extension of Möbius addition for a unit boundary input.
      return unit(mobiusAdd(w, unit(x)));
    }
    function householderReflect(y, w){
      const d = Math.max(EPS, norm2(w));
      return sub(y, scale(w, 2 * dot(w, y) / d));
    }
    // ---------- hyperbolic geodesic helpers ----------
    function geodesicFromTwoPoints(P,Q){

    function resolveCanvasColor(color){

        const g = Number(rgbaMatch[2]);

        { t: 0.88, rgb: [224, 128, 68] },
        { t: 1.00, rgb: [182, 76, 28] }

          rangeHtml: "",
          pointAName: (shared) => xParameterSpec(shared).pointLabel,
          pointBName: "w",
          pointAInfo: () => "",
          pointBInfo: () => "",
          helpText: () => {
            const roles = actionRoles();
            return `Householder action tab. The widget shows H_${roles.actorLabel}(${roles.inputLabel}); the input label follows the current LMS reduction state. Drag ξ independently on the boundary to retune the directional geometry.`;
          }
        },
        initTabState(){ return {}; },
        getScene(shared){
          const roles = actionRoles(shared);
          const xiBoundary = sharedBoundaryDirection(shared);
          const xi = scale(xiBoundary, 0.999);
          const negZPoint = xParameterModeId(shared) === "neg_z" ? clampToDisk(neg(shared.A), 0.999) : null;
          const reflected = householderReflect(roles.inputPoint, roles.actorPoint);
          const axisDir = perp(unit(norm(roles.actorPoint) > EPS ? roles.actorPoint : {x:1,y:0}));
          const axis = [scale(axisDir, -0.999), scale(axisDir, 0.999)];
          return { reflected, axis, actorPoint: roles.actorPoint, inputPoint: roles.inputPoint, xiBoundary, xi, negZPoint, roles };
        },
        getHandles(scene){
          return [{ id: "xi", point: scene.xi, radiusPx: 18 }];
        },
        dragHandle(handleId, diskPt, shared){
          if (handleId === "xi") setSharedBoundaryDirection(shared, diskPt);
        },
        drawScene(scene, api){
          api.withDiskClip(() => {
            api.drawPolyline(scene.axis, { stroke: "rgba(0,0,0,0.18)", lineWidth: 1.4, lineDash: [4, 6] });
            api.drawSegment({x:0,y:0}, scene.actorPoint, { stroke: "rgba(0,0,0,0.35)", lineWidth: 1.6, lineDash: [5, 5] });
            api.drawSegment(scene.inputPoint, scene.reflected, { stroke: "#000", lineWidth: 2.1 });
            api.drawSegment({x:0,y:0}, scene.inputPoint, { stroke: "rgba(0,0,0,0.28)", lineWidth: 1.2 });
            api.drawSegment({x:0,y:0}, scene.reflected, { stroke: "rgba(0,0,0,0.28)", lineWidth: 1.2 });
          });
          if (scene.negZPoint) {
            api.drawPoint(scene.negZPoint, { radius: 4.8, fill: "#fff", stroke: "#000", lineWidth: 1.7 });
          }
          api.drawPoint(scene.reflected, { radius: 7.5, fill: "#fff", stroke: "#000", lineWidth: 2.1 });
          api.drawPoint(scene.xi, { radius: 4.6, fill: "#000" });
        },
        drawLabels(scene, api){
          if (scene.negZPoint) {
            api.drawTextAtDisk("-z", scene.negZPoint, { dx: 8, dy: 14, font: `italic ${Math.max(11, Math.round(14 * api.currentUiScale()))}px Georgia, Times, serif` });
          }
          api.drawTextAtDisk(`${scene.roles.actorLabel}⊥`, scale(unit(perp(scene.actorPoint)), 0.72), { dx: 10, dy: -10, font: `${Math.max(12, Math.round(16 * api.currentUiScale()))}px Georgia, Times, serif` });
          drawTransformLabelAtDisk("H", scene.roles.actorLabel, scene.roles.inputLabel, scene.reflected, {
            dx: 12,
            dy: 16,
            fontSize: Math.max(13, Math.round(17 * api.currentUiScale())),
            subFontSize: Math.max(10, Math.round(12 * api.currentUiScale()))
          });
          api.drawTextAtDisk("ξ", scene.xi, { dx: 10, dy: -12, font: `italic ${Math.max(13, Math.round(17 * api.currentUiScale()))}px Georgia, Times, serif` });
        }
      },
      {
        id: "lms-reduced",
        label: "LMS",
        ui: {
          titleHtml: (_shared, _scene, local) => `Reduced LMS state on <span class="italic">(${lmsCoordinateMode(local)},ζ)</span>`,
          formulaHtml: (_shared, _scene, local) => lmsCoordinateMode(local) === "w"
            ? "z = -ζw,&nbsp; ẇ = -1/2 (1-|w|²) ζ<sup>-1</sup>Z<br/>ξ<sub>i</sub> = ζ M<sub>w</sub>(p<sub>i</sub>),&nbsp; Z = Σ a<sub>i</sub> ξ<sub>i</sub>"
            : "w = -ζ<sup>-1</sup>z,&nbsp; <br/>ξ<sub>i</sub> = M<sub>-z</sub>(ζp<sub>i</sub>),&nbsp; Z = Σ a<sub>i</sub> ξ<sub>i</sub>",
          rangeHtml: "",
          showSharedPointA: (shared) => boundaryRoles(shared).mode === "z",
          showSharedPointB: (shared) => boundaryRoles(shared).mode === "w",
          pointAName: (_shared, _scene, local) => lmsCoordinateMode(local) === "z" ? "z" : "x",
          pointBName: "w",
          pointAInfo: (_shared, scene, local) => scene?.activeId === "A"
            ? ` |${lmsCoordinateMode(local) === "z" ? "z" : "x"}|=${formatNum(norm(scene.activePoint), 2)}`
            : "",
          pointBInfo: (_shared, scene) => scene?.activeId === "B" ? ` |w|=${formatNum(norm(scene.activePoint), 2)}` : "",
          helpText: (_shared, _scene, local) => `LMS tab. The top-right switch sets the number of boundary atoms. Drag ζ on the boundary, drag the displayed interior point in the disk, drag the boundary atoms themselves, grab the white derived point to flip between (${lmsCoordinateMode(local)},ζ) reductions, and drag Z inside the convex hull to reweight the boundary atoms shown by their size and warm grey-to-orange color. LMS Potential Geometry now comes from the weighted boundary potential of those atoms, rather than from ζ itself.`
        },
        initTabState(){ return { atomCount: LMS_DEFAULT_ATOM_COUNT, orderPoint: null }; },
        getScene(shared, local){
          const boundary = lmsBoundaryCloud(shared, local);
          return {
            mode: boundary.mode,
            phi: boundary.phi,
            zeta: boundary.zeta,
            zetaHandle: scale(boundary.zeta, 0.999),
            z: boundary.z,
            w: boundary.w,
            activePoint: boundary.activePoint,
            activeId: boundary.activeId,
            activeName: boundary.activeLabel,
            derivedPoint: boundary.derivedPoint,
            derivedName: boundary.derivedName,
            samplePoints: boundary.labPoints,
            atomIds: boundary.atomIds,
            hullLoop: boundary.labLoop,
            bodyLoop: boundary.bodyLoop,
            weights: boundary.weights,
            Z: boundary.Z,
            precession: precessionValue(boundary.z, boundary.Z)
          };
        },
        getHandles(scene){
          const atomHandles = scene.samplePoints.map((point, idx) => ({
            id: `atom-${scene.atomIds[idx]}`,
            point,
            radiusPx: 16
          }));
          return [
            { id: "derived", point: scene.derivedPoint, radiusPx: 18 },
            { id: "zeta", point: scene.zetaHandle, radiusPx: 18 },
            { id: "Z", point: scene.Z, radiusPx: 18 },
            ...atomHandles
          ];
        },
        beginHandleDrag(handleId, scene, shared){
          if (handleId !== "derived") return;
          if (scene.mode === "w") {
            shared.A = clampToDisk(scene.derivedPoint, 0.999);
            shared.xParameterMode = "neg_z";
            shared.boundarySource = "B";
          } else {
            shared.B = clampToDisk(scene.derivedPoint, 0.999);
            shared.xParameterMode = "x";
            shared.boundarySource = "A";
          }
          syncActiveTabUi();
          invalidate();
        },
        dragHandle(handleId, diskPt, shared, local){
          if (handleId.startsWith("atom-")) {
            const atomId = Number(handleId.slice(5));
            setLmsBoundaryAtom(shared, local, atomId, diskPt);
            return;
          }
          if (handleId === "derived") {
            if (lmsCoordinateMode(local) === "w") {
              shared.B = clampToDisk(diskPt, 0.999);
            } else {
              shared.A = clampToDisk(diskPt, 0.999);
            }
            return;
          }
          if (handleId === "zeta") {
            setSharedBoundaryDirection(shared, diskPt);
            return;
          }
          if (handleId === "Z") {
            const boundary = lmsBoundaryCloud(shared, local);
            const clamped = clampToConvexPolygon(clampToDisk(diskPt, 0.999), boundary.labPoints);
            local.orderPoint = clamped;
          }
        },
        drawScene(scene, api){
          const theme = currentVisualTheme();
          const inkDim = rgbaHex(theme.ink, 0.26);
          const inkFaint = rgbaHex(theme.ink, 0.12);
          const inkGhost = rgbaHex(theme.ink, 0.20);
          api.withDiskClip(() => {
            if (scene.bodyLoop?.length > 1) {
              api.drawPolyline(scene.bodyLoop, { stroke: inkFaint, lineWidth: 0.95, lineDash: [2, 6] });
            }
            if (scene.hullLoop?.length > 1) {
              api.drawPolyline(scene.hullLoop, { stroke: inkDim, lineWidth: 1.15 });
            }
            api.drawSegment({x:0,y:0}, scene.z, { stroke: inkGhost, lineWidth: 1.2 });
            api.drawSegment({x:0,y:0}, scene.w, { stroke: inkGhost, lineWidth: 1.2 });
            api.drawVector({x:0,y:0}, scene.Z, { stroke: theme.ink, lineWidth: 1.9, headSize: 0.026 });
          });
          scene.samplePoints.forEach((point, idx) => {
            const weight = scene.weights[idx] ?? 0;
            const level = lmsWeightLevel(weight);
            const sizeLevel = lmsWeightSizeLevel(weight);
            const radius = interpolate(3.3, 12.6, sizeLevel);
            api.drawPoint(point, {
              radius,
              fill: heatJetColor(level),
              stroke: rgbaHex(theme.ink, 0.82),
              lineWidth: interpolate(0.75, 1.35, level),
              alpha: interpolate(0.78, 0.98, level)
            });
          });
          api.drawPoint(scene.zetaHandle, { radius: 8.0, fill: "#000" });
          api.drawPoint(scene.Z, { radius: 7.0, fill: "#000" });
          api.drawPoint(scene.derivedPoint, { radius: 7.2, fill: "#fff", stroke: theme.ink, lineWidth: 2.0 });
          api.drawCurvedArrow(
            scene.precession >= 0 ? 1 : -1,
            Math.abs(scene.precession),
            precessionVisibilityValue(scene.z, scene.Z)
          );
        },
        drawLabels(scene, api){
          const precessionAlpha = thomasPrecessionOpacity(precessionVisibilityValue(scene.z, scene.Z));
          api.drawTextAtDisk("ζ", scene.zetaHandle, { dx: 10, dy: -14, font: `italic ${Math.max(16, Math.round(19 * api.currentUiScale()))}px Georgia, Times, serif` });
          api.drawTextAtDisk("Z", scene.Z, { dx: 10, dy: -12, font: `${Math.max(14, Math.round(24 * api.currentUiScale()))}px Georgia, Times, serif` });
          api.drawTextAtDisk(scene.derivedName, scene.derivedPoint, { dx: 10, dy: 14, font: `italic ${Math.max(15, Math.round(18 * api.currentUiScale()))}px Georgia, Times, serif` });
          api.drawTextAtDisk("Thomas Precession", {x:0.13, y:0.13}, { dx: 0, dy: 0, alpha: precessionAlpha, font: `${Math.max(11, Math.round(13 * api.currentUiScale()))}px Georgia, Times, serif` });
        }
      }
    ];

    // Keep tabs in a stable pedagogical order.
    const TAB_ORDER = [
      "householder-action",
      "mobius-action",
      "lms-reduced"
    ];
    GEOMETRY_TABS.sort((a, b) => TAB_ORDER.indexOf(a.id) - TAB_ORDER.indexOf(b.id));

    // ---------- interaction shell ----------
    if (titleDrag) {
      titleDrag.addEventListener("pointerdown", (ev) => {
        const cs = getComputedStyle(wrap);
        state.titleDragState = {
          startX: ev.clientX,
          startY: ev.clientY,
          baseX: parseFloat(cs.getPropertyValue("--titleX")) || 0,
          baseY: parseFloat(cs.getPropertyValue("--titleY")) || 0,
          pid: ev.pointerId
        };
        try { titleDrag.setPointerCapture(ev.pointerId); } catch {}
        ev.preventDefault();
        ev.stopPropagation();
      });
      window.addEventListener("pointermove", (ev) => {
        if (!state.titleDragState) return;
        const dx = ev.clientX - state.titleDragState.startX;
        const dy = ev.clientY - state.titleDragState.startY;
        setTitleOffset(state.titleDragState.baseX + dx, state.titleDragState.baseY + dy);
        invalidate();
        ev.preventDefault();
      });
      window.addEventListener("pointerup", () => { state.titleDragState = null; });
      window.addEventListener("pointercancel", () => { state.titleDragState = null; });
    }
    if (btnHelp && helpCard) {
      btnHelp.addEventListener("click", () => {
        helpCard.classList.toggle("show");
      });
    }
    if (btnReset) {
      btnReset.addEventListener("click", () => {
        resetWidget();
      });
    }

    function startResize(ev, handle){
      const rect = wrap.getBoundingClientRect();
      state.resizing = { handle, startX: ev.clientX, startY: ev.clientY, startW: rect.width, pid: ev.pointerId };
      try { wrap.setPointerCapture(ev.pointerId); } catch {}
      ev.preventDefault();
      ev.stopPropagation();
    }
    function onResizeMove(ev){
      if (!state.resizing) return;
      const dx = ev.clientX - state.resizing.startX;
      const dy = ev.clientY - state.resizing.startY;
      let delta = 0;
      if (state.resizing.handle === "se") delta = Math.max(dx, dy);
      if (state.resizing.handle === "nw") delta = -Math.max(dx, dy);
      if (state.resizing.handle === "ne") delta = Math.max(dx, -dy);
      if (state.resizing.handle === "sw") delta = Math.max(-dx, dy);
      const minSize = 320;
      const maxSize = Math.min(window.innerWidth * 0.98, window.innerHeight * 0.86, 2200);
      const next = Math.max(minSize, Math.min(maxSize, state.resizing.startW + delta));
      wrap.style.width = `${next}px`;
      wrap.style.height = `${next}px`;
      resize();
      ev.preventDefault();
      ev.stopPropagation();
    }
    function endResize(ev){
      if (!state.resizing) return;
      state.resizing = null;
      try { wrap.releasePointerCapture(ev.pointerId); } catch {}
      ev.preventDefault();
      ev.stopPropagation();
    }
    wrap.querySelectorAll(".resizeHandle").forEach((el) => {
      el.addEventListener("pointerdown", (ev) => startResize(ev, el.dataset.handle || "se"));
    });
    wrap.addEventListener("pointermove", onResizeMove);
    wrap.addEventListener("pointerup", endResize);
    wrap.addEventListener("pointercancel", endResize);

    // ---------- pointer dragging for shared + per-tab handles ----------
    wrap.addEventListener("mousedown", (e) => {
      const target = hitTest(pointerPos(e));
      if (!target) return;
      beginDragTarget(target);
      state.dragTarget = target;
      e.preventDefault();
    });
    window.addEventListener("mousemove", (e) => {
      if (!state.dragTarget) return;
      applyDrag(state.dragTarget, pointerPos(e));
      e.preventDefault();
    });
    window.addEventListener("mouseup", () => {
      state.dragTarget = null;
    });

    wrap.addEventListener("touchstart", (e) => {
      const target = hitTest(pointerPos(e));
      if (!target) return;
      beginDragTarget(target);
      state.dragTarget = target;
      e.preventDefault();
    }, { passive: false });
    window.addEventListener("touchmove", (e) => {
      if (!state.dragTarget) return;
      applyDrag(state.dragTarget, pointerPos(e));
      e.preventDefault();
    }, { passive: false });
    window.addEventListener("touchend", () => {
      state.dragTarget = null;
    });

    // ---------- animation / repaint loop ----------
    function tick(ts){
      const tab = currentTab();
      const local = ensureTabState(tab.id);
      const dt = state.lastTimestampMs ? Math.min(0.05, (ts - state.lastTimestampMs) / 1000) : 0.016;
      state.lastTimestampMs = ts;
      if (typeof tab.step === "function") {
        tab.step(dt, state.shared, local, drawApi);
        invalidate();
      }
      if (state.needsRedraw) {
        draw();
        state.needsRedraw = false;
      }
      requestAnimationFrame(tick);
    }

    syncActiveTabUi();
    resize();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
