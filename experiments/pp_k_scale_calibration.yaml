experiment: k_scale_calibration
output_dir: temp_research/pp_k_scale_smart_current_auto_yaml

params:
  # Multiplicatively bracket and refine the edge where the final cloud first
  # becomes contracting without hitting the FFT boundary.
  # Values are all > 0.9 and avoid repeating the previous alpha grid.
  alphas: [0.94, 0.97, 0.985, 0.992, 0.9945, 0.995, 0.997, 0.998, 0.9992, 0.9999]
  seeds: [2026]
  reference_alpha: 0.99
  reference_K: 1.0
  baseline: current_auto
  deviation_min: 0.25
  deviation_max: 64.0
  bracket_multiplier: 2.0
  max_bracket_iterations: 8
  search_iterations: 8
  boundary_hit_fraction: 0.985
  min_final_time: 2.0

base_config:
  n_fibers: 10
  n_per_fiber: 300
  shape_names: [gaussian, ring, line, spiral, square, gaussian, ring, line, spiral, square]
  initialization_algorithm: raw
  alpha: 0.995
  K: null
  grid_size: 128
  domain_radius: 8.0
  dt: 0.055
  dt_min: 0.00025
  dt_max: 0.09
  adaptive_tol: 0.005
  max_steps: 200
  min_steps: 201
  tol_rms: 0.0
  max_displacement_per_step: 0.75
  backend: numpy
  force_backend: fft
  integrator: adaptive_rk4
  color_scheme: phase_color
  seed: 2026
  make_dashboard: false
  make_animation: true
  trajectory_frame_count: 80
  animation_density_grid_size: 96
  record_every: 25
  record_research_diagnostics: false
  max_plot_points_per_group: 300
  max_animation_points_per_group: 300
